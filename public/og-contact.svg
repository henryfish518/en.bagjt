<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Hongyun Jiangtian — FIBC Bulk Bag Manufacturer from China, supplying the Middle East">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5695"/>
      <stop offset="0.55" stop-color="#193b70"/>
      <stop offset="1" stop-color="#0e203c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1090" cy="90" r="220" fill="#f27c22" fill-opacity="0.17"/>
  <circle cx="90" cy="590" r="190" fill="#4d76b3" fill-opacity="0.18"/>

  <g transform="translate(80, 96)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#ffffff" fill-opacity="0.1"/>
    <g transform="translate(16, 14)" fill="none" stroke="#f27c22" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3h20l2.4 9v25a3.6 3.6 0 0 1-3.6 3.6H11.2A3.6 3.6 0 0 1 7.6 37V12L8 3Z"/>
      <path d="M6.4 12h23.2"/>
      <path d="M13.6 21h8.8"/>
    </g>
  </g>

  <text x="172" y="140" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Hongyun Jiangtian</text>
  <text x="172" y="166" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#f27c22">BAGJT.COM</text>

  <text x="80" y="300" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">FIBC Bulk Bag Manufacturer</text>
  <text x="80" y="358" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="46" font-weight="800" fill="#f27c22">from China</text>

  <text x="80" y="424" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#adc4e4">Supply to the Middle East</text>
  <text x="1120" y="424" direction="rtl" text-anchor="end" font-family="Cairo, 'Noto Kufi Arabic', 'Noto Sans Arabic', Arial, sans-serif" font-size="26" font-weight="700" fill="#adc4e4">توريد إلى دول الشرق الأوسط</text>
  <text x="80" y="466" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="21" fill="#7fa1d2">Polypropylene (PP) · 500–2000 kg · Safety factor 5:1 / 6:1</text>

  <g font-family="Inter, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
    <rect x="80" y="512" width="146" height="42" rx="8" fill="#f27c22"/>
    <text x="105" y="539">Custom size</text>
    <rect x="242" y="512" width="182" height="42" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <text x="264" y="539">Food grade</text>
    <rect x="440" y="512" width="196" height="42" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <text x="462" y="539">Conductive B/C/D</text>
    <rect x="652" y="512" width="132" height="42" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <text x="674" y="539">ISO 9001</text>
  </g>
